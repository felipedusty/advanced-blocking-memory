name: lookup-bench

on:
  workflow_dispatch:
    inputs:
      queries:
        description: "lookups per timing pass"
        default: "1000000"
      repetitions:
        description: "timing passes per structure"
        default: "9"

permissions:
  contents: read

jobs:
  bench:
    name: lookup-bench (${{ matrix.tag }})
    # The lab only runs on the public repository, like the lab workflow.
    if: ${{ github.event.repository.visibility == 'public' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: amd64, os: ubuntu-24.04}
          - {tag: arm64, os: ubuntu-24.04-arm}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Environment
        run: |
          uname -a
          nproc
          lscpu | head -20
          free -m

      - name: Lists
        run: lab/fetch-lists.sh

      - name: Lookup benchmark
        env:
          QUERIES: ${{ inputs.queries }}
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          set -euo pipefail
          mkdir -p results
          biggest=$(ls -S lab/lists/* | head -1)
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            -v "$PWD":/src -w /src/lab/lookup-bench mcr.microsoft.com/dotnet/sdk:10.0 \
            dotnet run -c Release -- "/src/$biggest" "$QUERIES" "$REPETITIONS" | tee "results/lookup-bench-${{ matrix.tag }}.txt"
          {
            echo "## lookup-bench ${{ matrix.tag }}"
            echo '```'
            cat "results/lookup-bench-${{ matrix.tag }}.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lookup-bench-${{ matrix.tag }}
          retention-days: 90
          path: results/lookup-bench-*.txt
